
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#10131c">
    <title>Top Arena 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game"></canvas>

    <div id="hud">
        <div class="topbar">
            <div class="stat">
                <span>❤️</span>
                <b id="health">100 / 100</b>
            </div>
            <div class="stat">
                <span>🪙</span>
                <b id="coins">100</b>
            </div>
            <div class="stat">
                <span>⭐</span>
                <b id="level">Ур. 1</b>
            </div>
            <button id="shopButton">МАГАЗИН</button>
        </div>

        <div class="bottomHud">
            <div id="weaponInfo">
                <b id="weaponName">Пистолет</b>
                <span id="ammo">∞</span>
            </div>
            <button id="superButton">
                <span>⚡</span>
                <b id="superName">Суперудар</b>
                <small id="superStatus">Не куплено</small>
            </button>
        </div>

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <button id="shootButton">ОГОНЬ</button>
        <button id="reloadButton">↻</button>
        <div id="message"></div>
    </div>

    <div id="menu" class="overlay">
        <div class="panel">
            <h1>TOP <span>ARENA</span></h1>
            <p>2D-битва с видом сверху</p>
            <input id="playerName" maxlength="16"
                   placeholder="Имя игрока" value="Игрок">
            <button id="startButton">ИГРАТЬ</button>
            <p class="hint">WASD — движение · Мышь — прицел · Пробел — огонь</p>
        </div>
    </div>

    <div id="shop" class="overlay hidden">
        <div class="panel shopPanel">
            <div class="shopHeader">
                <h2>МАГАЗИН</h2>
                <button id="closeShop">✕</button>
            </div>
            <div class="moneyLine">Твои монеты: <b id="shopCoins">100</b> 🪙</div>
            <div id="shopItems"></div>
        </div>
    </div>

    <style id="dynamicStyles">
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #10131c;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        button, input {
            font: inherit;
        }

        button {
            color: white;
            background: #526dff;
            border: 0;
            border-radius: 10px;
            padding: 11px 14px;
            font-weight: bold;
        }

        button:active {
            transform: scale(.96);
        }

        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        #hud button, #joystick {
            pointer-events: auto;
            user-select: none;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 12px;
        }

        .stat {
            display: flex;
            gap: 5px;
            align-items: center;
            background: #171d2be8;
            border: 1px solid #343d54;
            border-radius: 9px;
            padding: 9px;
            font-size: 12px;
        }

        #shopButton {
            margin-left: auto;
            background: #f2a93b;
            color: #211708;
        }

        .bottomHud {
            position: absolute;
            right: 12px;
            bottom: 18px;
            display: flex;
            align-items: end;
            gap: 8px;
        }

        #weaponInfo {
            display: grid;
            gap: 6px;
            padding: 11px;
            min-width: 105px;
            border-radius: 10px;
            background: #171d2be8;
            border: 1px solid #343d54;
        }

        #weaponInfo span {
            color: #b6c3e3;
            font-size: 12px;
        }

        #superButton {
            background: #9b42e8;
            min-width: 110px;
            display: grid;
            gap: 4px;
        }

        #superButton span {
            font-size: 20px;
        }

        #superButton small {
            font-size: 10px;
        }

        #joystick {
            position: absolute;
            left: 22px;
            bottom: 25px;
            width: 122px;
            height: 122px;
            border-radius: 50%;
            background: #d5e0ff22;
            border: 2px solid #d5e0ff55;
            display: grid;
            place-items: center;
        }

        #stick {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #829bffcc;
            border: 2px solid #dce4ff;
            box-shadow: 0 3px 12px #0005;
        }

        #shootButton {
            position: absolute;
            right: 22px;
            bottom: 125px;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #ef4d5b;
            border: 3px solid #ffb3ba;
        }

        #reloadButton {
            position: absolute;
            right: 29px;
            bottom: 210px;
            width: 46px;
            height: 42px;
            background: #394761;
            font-size: 22px;
        }

        #message {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #171d2be8;
            border-radius: 9px;
            padding: 10px 14px;
            opacity: 0;
            transition: opacity .2s;
            white-space: nowrap;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 18px;
            background: #070a12cc;
        }

        .hidden {
            display: none !important;
        }

        .panel {
            width: min(420px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 24px;
            border: 1px solid #35415d;
            border-radius: 18px;
            background: #171d2b;
            box-shadow: 0 20px 80px #0008;
        }

        h1 {
            font-size: 32px;
            margin: 0;
            letter-spacing: 2px;
        }

        h1 span {
            color: #8095ff;
        }

        .panel > p {
            color: #aab6d0;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #3b4864;
            background: #0d1220;
            color: white;
            margin: 10px 0;
            outline: none;
        }

        #startButton {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            background: #526dff;
        }

        .hint {
            font-size: 11px;
        }

        .shopPanel {
            padding: 18px;
        }

        .shopHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .shopHeader h2 {
            margin: 0;
        }

        #closeShop {
            padding: 7px 11px;
            background: #39445a;
        }

        .moneyLine {
            margin: 15px 0;
            color: #f2c36e;
        }

        .shopItem {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            padding: 12px;
            border-radius: 11px;
            background: #222b3e;
        }

        .shopItem div {
            min-width: 0;
        }

        .shopItem strong {
            display: block;
            margin-bottom: 5px;
        }

        .shopItem small {
            color: #aab6d0;
            line-height: 1.4;
        }

        .shopItem button {
            flex-shrink: 0;
        }

        @media (min-width: 700px) {
            #joystick {
                width: 135px;
                height: 135px;
            }

            #shootButton {
                width: 88px;
                height: 88px;
            }
        }
    </style>

    <script src="game.js"></script>
</body>
</html>
