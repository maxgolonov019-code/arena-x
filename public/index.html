<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10131c">
    <title>Neon Strike</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent: #6c8cff;
            --panel: rgba(18, 23, 37, 0.94);
            --text: #f4f6ff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #10131c;
            color: var(--text);
            font: 14px Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }

        button, input {
            font: inherit;
        }

        button {
            color: white;
            border: 1px solid #414b68;
            background: #252d43;
            border-radius: 10px;
            padding: 11px 15px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.96);
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .hud {
            position: fixed;
            z-index: 5;
            pointer-events: none;
        }

        .topHud {
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            max-width: 75%;
        }

        .stat {
            background: var(--panel);
            border: 1px solid #343d56;
            padding: 9px 11px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #0004;
        }

        .stat strong {
            color: #8eabff;
        }

        #health {
            color: #ff6d7d;
        }

        #coins {
            color: #ffd76a;
        }

        #connection {
            margin-top: 5px;
            color: #ffcf6b;
            font-size: 11px;
        }

        #shopButton {
            pointer-events: auto;
            background: #596fe0;
            border-color: #8192ff;
            font-weight: bold;
        }

        .bottomHud {
            left: 50%;
            bottom: 15px;
            transform: translateX(-50%);
            text-align: center;
            background: var(--panel);
            border: 1px solid #343d56;
            border-radius: 12px;
            padding: 10px 16px;
            min-width: 155px;
        }

        #weaponName {
            font-weight: bold;
            font-size: 16px;
        }

        #ammo {
            margin-top: 4px;
            color: #b9c5e8;
        }

        #superButton {
            margin-top: 8px;
            padding: 7px 10px;
            background: #47316f;
            border-color: #9169df;
        }

        #superStatus {
            display: block;
            margin-top: 4px;
            color: #c6a8ff;
            font-size: 11px;
        }

        .control {
            position: fixed;
            z-index: 6;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick {
            left: 22px;
            bottom: 28px;
            width: 116px;
            height: 116px;
            border-radius: 50%;
            border: 2px solid #7784a766;
            background: #202a4080;
        }

        #stick {
            position: absolute;
            width: 48px;
            height: 48px;
            left: 32px;
            top: 32px;
            border-radius: 50%;
            background: #91a9ffb8;
            border: 2px solid #c1ceff;
            box-shadow: 0 0 15px #698aff55;
        }

        .actionButton {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-weight: bold;
            background: #343d5dcc;
            border: 2px solid #8b9ac9;
        }

        #shootButton {
            right: 23px;
            bottom: 38px;
            width: 82px;
            height: 82px;
            background: #a8324ddd;
            border-color: #ff8392;
        }

        #reloadButton {
            right: 32px;
            bottom: 132px;
        }

        #message {
            position: fixed;
            z-index: 8;
            left: 50%;
            top: 23%;
            transform: translateX(-50%);
            max-width: 85%;
            padding: 10px 16px;
            text-align: center;
            border-radius: 10px;
            background: #111827eF;
            border: 1px solid #4b5c85;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            z-index: 20;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            background: #080b13d9;
            overflow-y: auto;
            touch-action: pan-y;
        }

        .panel {
            width: min(420px, 100%);
            padding: 24px;
            border-radius: 18px;
            background: #171d2c;
            border: 1px solid #3d4968;
            box-shadow: 0 15px 60px #0008;
            text-align: center;
        }

        .panel h1 {
            margin: 0 0 8px;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #aab6d7;
            line-height: 1.5;
            margin: 10px 0 20px;
        }

        #playerName {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px;
            color: white;
            background: #0e1320;
            border: 1px solid #424e6c;
            border-radius: 10px;
            outline: none;
        }

        #playerName:focus {
            border-color: var(--accent);
        }

        #startButton {
            width: 100%;
            background: #526be0;
            border-color: #8194ff;
            font-weight: bold;
            padding: 13px;
        }

        .shopPanel {
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .shopHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .shopHeader h2 {
            margin: 0;
        }

        #shopCoins {
            color: #ffd76a;
            margin: 12px 0;
        }

        #shopItems {
            overflow-y: auto;
            touch-action: pan-y;
            text-align: left;
        }

        .shopItem {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #303950;
        }

        .itemInfo {
            min-width: 0;
        }

        .itemInfo strong {
            display: block;
            margin-bottom: 5px;
        }

        .itemInfo small {
            display: block;
            color: #aab6d7;
            line-height: 1.4;
        }

        .buyButton {
            flex-shrink: 0;
            background: #354a85;
        }

        #closeShop {
            margin-top: 12px;
            flex-shrink: 0;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .topHud {
                top: 8px;
                left: 8px;
                right: 8px;
            }

            .stats {
                gap: 5px;
            }

            .stat {
                padding: 7px 8px;
                font-size: 12px;
            }

            #shopButton {
                padding: 9px 11px;
            }

            .bottomHud {
                bottom: 12px;
                min-width: 130px;
                padding: 8px 11px;
            }

            #joystick {
                width: 105px;
                height: 105px;
                left: 15px;
                bottom: 22px;
            }

            #stick {
                left: 27px;
                top: 27px;
            }

            #shootButton {
                right: 15px;
                bottom: 30px;
                width: 74px;
                height: 74px;
            }

            #reloadButton {
                right: 24px;
                bottom: 117px;
                width: 58px;
                height: 58px;
            }

            .panel {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <canvas id="game"></canvas>

    <div class="hud topHud">
        <div class="stats">
            <div class="stat">
                ❤️ <strong id="health">100</strong>
            </div>

            <div class="stat">
                🪙 <strong id="coins">100</strong>
            </div>

            <div class="stat">
                Уровень <strong id="level">1</strong>
            </div>

            <div class="stat">
                Игроки <strong id="playerCount">1</strong>
                <div id="connection">● Одиночная игра</div>
            </div>
        </div>

        <button id="shopButton">МАГАЗИН</button>
    </div>

    <div class="hud bottomHud">
        <div id="weaponName">Пистолет</div>
        <div id="ammo">12 / 12</div>

        <button id="superButton">
            <span id="superName">Суперспособность</span>
        </button>

        <span id="superStatus">Не выбрана</span>
    </div>

    <div id="joystick" class="control">
        <div id="stick"></div>
    </div>

    <button id="shootButton" class="control actionButton">
        ОГОНЬ
    </button>

    <button id="reloadButton" class="control actionButton">
        ↻
    </button>

    <div id="message"></div>

    <div id="menu" class="overlay">
        <div class="panel">
            <h1>NEON STRIKE</h1>

            <p class="subtitle">
                Сражайся с ботами, собирай монеты,
                покупай оружие и открывай способности.
            </p>

            <input
                id="playerName"
                type="text"
                maxlength="16"
                placeholder="Имя игрока"
                autocomplete="off"
            >

            <button id="startButton">НАЧАТЬ ИГРУ</button>

            <p class="subtitle">
                Управление: джойстик — движение,
                касание поля — прицеливание.
            </p>
        </div>
    </div>

    <div id="shop" class="overlay hidden">
        <div class="panel shopPanel">
            <div class="shopHeader">
                <h2>Магазин</h2>
                <button id="closeShop">✕</button>
            </div>

            <div id="shopCoins">Монеты: 100</div>

            <div id="shopItems"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
